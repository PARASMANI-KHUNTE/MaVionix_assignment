services:
  - type: web
    name: ai-powered-crm
    runtime: node
    plan: free
    region: singapore # Closest to Neon ap-southeast-1
    buildCommand: npm run build:render
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CLIENT_URL
        value: https://ai-powered-crm.onrender.com
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: ALLOW_NO_AUTH
        value: "true"
      - key: NEON_BRANCH
        value: production
      - key: AWS_REGION
        value: ap-southeast-1
      - key: NEON_FUNCTION_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: NEON_AUTH_JWKS_URL
        sync: false
      - key: NEON_REALTIME_URL
        sync: false
      - key: NEON_REALTIME_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: NEON_AI_GATEWAY_TOKEN
        sync: false
      - key: NEON_AI_GATEWAY_BASE_URL
        sync: false
